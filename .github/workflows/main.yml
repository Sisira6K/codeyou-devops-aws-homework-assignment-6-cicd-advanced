name: Main CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
           ruby-version: '3.1'
      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install
  
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push to Dockerhub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ruby-app:${{ github.ref_name }} -t ${{ secrets.DOCKER_USERNAME}}-$(git rev-parse --abbrev-ref HEAD) ${{ secrets.DOCKER_USERNAME }}/ruby-app:${{ github.ref_name }}-$(git rev-parse --short HEAD)
          docker push ${{ secrets.DOCKER_USERNAME }}/ruby-app:${{ github.ref_name }} ${{ secrets.DOCKER_USERNAME}}-$(git rev-parse --abbrev-ref HEAD) ${{ secrets.DOCKER_USERNAME }}/ruby-app:${{ github.ref_name }}-$(git rev-parse --short HEAD)